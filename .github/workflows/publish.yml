name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag=${tag_version} manifest=${manifest_version}"
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version ${manifest_version}"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (workspace, all features)
        run: cargo test --workspace --all-features

      - name: Resolve crates.io credentials
        id: credentials
        env:
          REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${REGISTRY_TOKEN}" ]; then
            echo "Using the CARGO_REGISTRY_TOKEN repository secret."
            echo "trusted_publishing=false" >> "$GITHUB_OUTPUT"
          else
            echo "CARGO_REGISTRY_TOKEN is not set, using crates.io trusted publishing."
            echo "trusted_publishing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io (trusted publishing)
        if: steps.credentials.outputs.trusted_publishing == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          TRUSTED_PUBLISHING: ${{ steps.credentials.outputs.trusted_publishing }}
        run: |
          set -euo pipefail

          # Crates must be published in dependency order; crates.io needs a
          # moment to update the index before dependent crates resolve.
          crates=(vmix-core vmix-tcp vmix-shortcuts vmix-http vmix-rs)

          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"

          # crates.io reports a missing permission as 401/403. Retrying cannot
          # fix that, so fail with the exact configuration that is required.
          explain_credentials_failure() {
            local crate="$1"
            echo "::error::crates.io rejected the credentials for ${crate} ${version}."
            if [ "${TRUSTED_PUBLISHING}" = "true" ]; then
              echo "::error::A trusted publishing token can only publish the crates that have a trusted publisher entry for this repository, this workflow filename (publish.yml) and this environment (none)."
              echo "::error::Add one at https://crates.io/crates/${crate}/settings, or set the CARGO_REGISTRY_TOKEN repository secret to a token that can publish every crate."
              echo "::error::Note that crates.io requires the first release of a new crate to be published with such a token: trusted publishing cannot create a crate."
              echo "::error::See docs/RELEASING.md for the full release checklist."
            else
              echo "::error::Check that the CARGO_REGISTRY_TOKEN secret is a valid crates.io API token with the publish-new and publish-update scopes."
              echo "::error::See docs/RELEASING.md for the full release checklist."
            fi
            exit 1
          }

          for crate in "${crates[@]}"; do
            echo "::group::Publish ${crate} ${version}"
            if curl -fsS "https://crates.io/api/v1/crates/${crate}/${version}" \
              -H "User-Agent: vmix-rs-release-workflow" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping"
              echo "::endgroup::"
              continue
            fi

            published=0
            for attempt in 1 2 3 4 5 6; do
              set +e
              output="$(cargo publish -p "${crate}" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "${output}"

              if [ "${status}" -eq 0 ]; then
                published=1
                break
              fi

              if printf '%s' "${output}" | grep -qiE 'not valid for crate|does not have the required permissions|401 Unauthorized|403 Forbidden'; then
                explain_credentials_failure "${crate}"
              fi

              if [ "${attempt}" -eq 6 ]; then
                break
              fi

              echo "attempt ${attempt} failed for ${crate}; retrying in 15s"
              sleep 15
            done

            if [ "${published}" -ne 1 ]; then
              echo "::error::Failed to publish ${crate} ${version}"
              exit 1
            fi
            echo "::endgroup::"
            sleep 10
          done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
