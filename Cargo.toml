[workspace]
members = [
    "vmix-core",
    "vmix-tcp",
    "vmix-http",
    "vmix-shortcuts",
    "vmix-rs",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
authors = ["Shugo Kawamura <ruk1ium@gmail.com>"]
repository = "https://github.com/FlowingSPDG/vmix-rs"
license = "MIT"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0.229", default-features = false }
quick-xml = { version = "0.42.0", default-features = false }
anyhow = "1.0.104"

# TCP dependencies
# (none, uses std only)

# HTTP dependencies
tokio = { version = "1.54.1", default-features = false }
shiguredo_http11 = "2026.6.1"
async-trait = "0.1.92"

# Other
urlencoding = "2.1.3"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
